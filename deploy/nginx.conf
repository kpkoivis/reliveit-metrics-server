# nginx side of the metrics server, for the host that terminates https for kurkisoft.com.
# The metrics server itself runs on 192.168.11.155:3020.
#
# 1. Put the limit_req_zone line in the http {} context. On Ubuntu, saving it as
#    /etc/nginx/conf.d/reliveit-metrics-zone.conf does that. It allows each client address
#    two posts a second on average; the game posts once per age up, batched, so a real
#    player stays far below it.
#
#    limit_req_zone $binary_remote_addr zone=reliveit_metrics:10m rate=2r/s;
#
# 2. Save the server block below as /etc/nginx/sites-available/data.kurkisoft.com, enable it,
#    and let certbot add https the same way it did for the other hosts:
#
#    sudo ln -s /etc/nginx/sites-available/data.kurkisoft.com /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d data.kurkisoft.com
#
#    certbot rewrites the block to listen on 443 and redirect port 80, as with the others.
#    DNS for data.kurkisoft.com has to point at this host before that step.

server {
    server_name data.kurkisoft.com;

    listen 80;
    listen [::]:80;

    location = /v1/snapshots {
        limit_req zone=reliveit_metrics burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;

        proxy_pass http://192.168.11.155:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v1/purchases {
        limit_req zone=reliveit_metrics burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;

        proxy_pass http://192.168.11.155:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://192.168.11.155:3020;
    }

    location / {
        return 404;
    }
}
