services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: metrics
      POSTGRES_USER: metrics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrics -d metrics"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Metrics: Host=db;Database=metrics;Username=metrics;Password=${POSTGRES_PASSWORD}
      Metrics__ApiKey: ${METRICS_API_KEY:?set METRICS_API_KEY in .env}
    # Local only: put a reverse proxy that terminates https in front of this.
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
